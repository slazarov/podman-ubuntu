name: podman-fuse-overlayfs
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
version_schema: none
maintainer: "Podman Ubuntu <noreply@github.com>"
description: "FUSE overlay filesystem for rootless containers (compiled from source)"
vendor: "podman-ubuntu"
homepage: "https://github.com/containers/fuse-overlayfs"
license: "GPL-2.0-or-later"
section: admin
priority: optional
deb:
  compression: xz

depends:
  # fusermount3, which fuse-overlayfs runs to unmount (as Debian's and
  # Ubuntu's own fuse-overlayfs package declares). The binary is linked
  # statically, so library detection finds nothing to add.
  - fuse3
  # System libraries detected from the binary and injected at build time
  # (empty for the usual static build).
${DETECTED_DEPENDS}

conflicts:
  - fuse-overlayfs

replaces:
  - fuse-overlayfs

provides:
  - fuse-overlayfs

contents:
  - src: "${DESTDIR}/usr/bin/fuse-overlayfs"
    dst: /usr/bin/fuse-overlayfs
    file_info:
      mode: 0755
