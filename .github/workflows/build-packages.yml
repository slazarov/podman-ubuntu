name: Build and Publish Packages

on:
  schedule:
    # One cron per auto-updating track; the firing cron selects the track (see the
    # resolve-track job).
    - cron: '30 4 * * *'  # 04:30 UTC — nightly (upstream HEAD)
    - cron: '30 5 * * *'  # 05:30 UTC — stable  (Podman 6.x, series-cap + soak)
    - cron: '30 6 * * *'  # 06:30 UTC — v5      (Podman 5.x maintenance, series-cap + soak)
  workflow_dispatch:
    inputs:
      build_track:
        description: 'Build track (stable = Podman 6.x, v5 = Podman 5.x maintenance, nightly = upstream HEAD)'
        required: true
        type: choice
        options:
          - stable
          - v5
          - nightly
        default: stable
      force_rebuild:
        description: 'Force a stable/v5 rebuild even when every package is already published at the resolved version (bypasses the republish guard). Use it to republish after a packaging-only change. It does not override a resolver hold (no soaked release yet): with nothing to resolve there is nothing to build. Ignored on nightly, which is never guarded on dispatch.'
        required: false
        type: boolean
        default: false

# Least privilege: every job can read the repository and nothing else. The
# publish job adds what the Pages deploy needs (and read access to this run's
# job list).
permissions:
  contents: read

# One queue per track. A new run of a track waits for the previous run of the
# same track instead of replacing it: GitHub's default (queue: single) keeps
# only one pending run per group and cancels the others, which dropped
# scheduled runs. Different tracks build in parallel; the publish job has its
# own group (pages-deploy) so only one run assembles and deploys at a time.
concurrency:
  group: build-packages-${{ github.event_name == 'workflow_dispatch' && inputs.build_track || github.event.schedule == '30 4 * * *' && 'nightly' || github.event.schedule == '30 5 * * *' && 'stable' || github.event.schedule == '30 6 * * *' && 'v5' || 'unmapped' }}
  cancel-in-progress: false
  queue: max

jobs:
  # ============================================
  # Resolve which track this run builds, and its versions
  # ============================================
  # Single source of truth for the track and (stable/v5) the component
  # versions, consumed by every downstream job. A manual dispatch uses its
  # input; a scheduled run maps the firing cron string (github.event.schedule)
  # to a track.
  #
  # The resolver runs here once. Its output (resolved_env) is handed to the
  # republish guard and every build cell, which validate it before use, so
  # they all compare and build exactly the same tags even if upstream tags a
  # release in between. Exit code 3 is a deterministic hold (upstream
  # reachable, nothing soaked yet): hold=true and the run builds nothing,
  # successfully, even with force_rebuild. Any other failure fails the run.
  resolve-track:
    runs-on: ubuntu-24.04
    outputs:
      track: ${{ steps.pick.outputs.track }}
      hold: ${{ steps.resolve.outputs.hold }}
      resolved_env: ${{ steps.resolve.outputs.resolved_env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pick track
        id: pick
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TRACK="${{ inputs.build_track }}"
          else
            case "${{ github.event.schedule }}" in
              '30 4 * * *') TRACK="nightly" ;;
              '30 5 * * *') TRACK="stable" ;;
              '30 6 * * *') TRACK="v5" ;;
              # Fail loud rather than silently building+publishing the wrong track
              # if a cron is ever added/edited without updating this map.
              *) echo "::error::unmapped schedule '${{ github.event.schedule }}' — add it to resolve-track"; exit 1 ;;
            esac
          fi
          echo "track=${TRACK}" >> "$GITHUB_OUTPUT"
          echo "Resolved track: ${TRACK}"

      - name: Resolve stable/v5 component versions
        id: resolve
        if: steps.pick.outputs.track == 'stable' || steps.pick.outputs.track == 'v5'
        env:
          TRACK: ${{ steps.pick.outputs.track }}
        run: |
          set -euo pipefail
          source scripts/ci_helpers.sh
          RESOLVED="${RUNNER_TEMP}/resolved.env"
          # hold=true on exit code 3; any other failure fails the step.
          HOLD="$(resolve_track_versions "${TRACK}" . "${RESOLVED}")"
          echo "${HOLD}" >> "$GITHUB_OUTPUT"
          if [[ "${HOLD}" == "hold=true" ]]; then
            echo "::notice::Resolver hold for ${TRACK}: no soaked release yet; nothing to build."
            exit 0
          fi
          cat "${RESOLVED}"
          {
            echo "resolved_env<<RESOLVED_ENV_EOF"
            cat "${RESOLVED}"
            echo "RESOLVED_ENV_EOF"
          } >> "$GITHUB_OUTPUT"

  # ============================================
  # Check if upstream components changed (nightly cron only)
  # ============================================
  # HEAD-SHA guard for the NIGHTLY cron only (nightly builds from upstream HEAD).
  # Gated to the 04:30 cron specifically so the stable/v5 crons — which are guarded
  # by check-republish instead — never trip this nightly-semantics short-circuit.
  #
  # It compares each component's upstream HEAD with the checkpoint of commits
  # that were built AND deployed, per build cell (<distro>-<arch>). This job
  # only restores the checkpoint; the publish job saves it after a successful
  # deploy, with only the cells it deployed. A failed or undeployed build
  # therefore never marks its commits as done, and the next nightly builds
  # them again.
  check-changes:
    if: github.event_name == 'schedule' && github.event.schedule == '30 4 * * *'
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the nightly checkpoint
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nightly-revisions/checkpoint.txt
          key: nightly-rev-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nightly-rev-v2-

      - name: Detect upstream changes
        id: detect
        run: |
          set -euo pipefail
          source scripts/ci_helpers.sh
          eval "$(sed -n '/^VALID_TRACKS=/,/^VALID_DISTROS=/p' config.sh)"
          mapfile -t CELLS < <(ci_build_cells "${VALID_DISTROS[@]}")
          RESULT="$(nightly_detect_changes /tmp/nightly-revisions/checkpoint.txt "${CELLS[@]}")"
          echo "${RESULT}"
          echo "${RESULT}" >> "$GITHUB_OUTPUT"

  # ============================================
  # Republish guard (stable/v5 — dispatch or cron)
  # ============================================
  # Both auto-updating tracks (stable, v5) rebuild + republish all four cells even
  # when nothing changed. This job short-circuits the run when every component
  # (and the podman-suite meta-package) is already published, on every
  # distro and arch, at the version resolve-track resolved. It reads that
  # resolved environment instead of running the resolver again. It is
  # strictly conservative (any fetch uncertainty yields skip=false).
  # Nightly is untouched — check-changes guards its scheduled run.
  check-republish:
    needs: [resolve-track]
    if: (needs.resolve-track.outputs.track == 'stable' || needs.resolve-track.outputs.track == 'v5') && needs.resolve-track.outputs.hold != 'true'
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare resolved versions against the live repository
        id: guard
        env:
          TRACK: ${{ needs.resolve-track.outputs.track }}
          RESOLVED_ENV: ${{ needs.resolve-track.outputs.resolved_env }}
          REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          printf '%s\n' "${RESOLVED_ENV}" > "${RUNNER_TEMP}/resolved.env"
          ./scripts/check_republish_needed.sh "${TRACK}" "${REPO_URL}" "${RUNNER_TEMP}/resolved.env"

  # ============================================
  # Build all distro x arch cells in one matrix
  # ============================================
  # CICD-05: one strategy.matrix fans out to all four cells in a single run.
  # fail-fast: false — a 26.04 cell failure must NOT abort the 24.04 cells.
  # CICD-06: the runner label is a matrix FIELD (matrix.runner), not hardcoded
  #   in any step. When GA ubuntu-26.04 / ubuntu-26.04-arm runners land, switch
  #   a 26.04 cell off its container by editing that cell's `runner` (and
  #   blanking its `container`) — a one-line change per cell, no step edits.
  # CICD-07: cache keys and artifact names carry the distro and arch so a
  #   26.04 build can never reuse a 24.04 cache or land in a 24.04 artifact.
  # The job name carries both too: the publish job reads each cell's
  # conclusion by that name (build-<distro>-<arch>).
  build:
    name: build-${{ matrix.distro }}-${{ matrix.arch }}
    needs: [resolve-track, check-changes, check-republish]
    # Gate order: a resolver hold builds nothing (force_rebuild cannot
    # override it: there are no versions to build). check-changes guards the
    # nightly cron; check-republish guards the stable/v5 tracks (dispatch or
    # cron). A SKIPPED guard job yields an empty output, and '' != 'true', so
    # neither guard blocks a run it doesn't apply to. A FAILED guard blocks the
    # build. The `force_rebuild` dispatch input overrides the republish guard so
    # a packaging-only change (no pinned-version bump) can still be republished;
    # it is null on cron, so it only ever loosens a manual dispatch.
    if: >-
      always()
      && needs.resolve-track.result == 'success'
      && needs.resolve-track.outputs.hold != 'true'
      && needs.check-changes.result != 'failure'
      && needs.check-republish.result != 'failure'
      && (github.event_name == 'workflow_dispatch' || needs.check-changes.outputs.skip != 'true')
      && (needs.check-republish.outputs.skip != 'true' || inputs.force_rebuild)
    runs-on: ${{ matrix.runner }}
    # Empty matrix.container => GitHub Actions runs directly on the runner host
    # (the 2404 cells). The 2604 cells run inside an ubuntu:26.04 container on
    # the same native amd64/arm64 host runners.
    container: ${{ matrix.container }}
    timeout-minutes: 180
    # Container jobs default run: steps to /bin/sh (bare ubuntu:26.04 has no
    # bash until bootstrap installs it), which breaks every [[ ]] in the build
    # steps. Force bash for the whole job; the two pre-bash bootstrap steps
    # below override back to sh explicitly.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # One include entry per cell pairs distro<->arch<->runner<->container
        # explicitly (no cartesian product + exclusions). To move a 26.04 cell
        # onto a future GA runner, change its `runner` and set `container: ''`.
        # The arch list must match CI_BUILD_ARCHES in scripts/ci_helpers.sh
        # (tests/test_ci_helpers.sh checks it).
        include:
          - distro: '2404'
            arch: amd64
            runner: ubuntu-24.04
            container: ''
          - distro: '2404'
            arch: arm64
            runner: ubuntu-24.04-arm
            container: ''
          - distro: '2604'
            arch: amd64
            runner: ubuntu-24.04
            container: ubuntu:26.04
          - distro: '2604'
            arch: arm64
            runner: ubuntu-24.04-arm
            container: ubuntu:26.04
    steps:
      # 2604 cells start from a bare ubuntu:26.04 container as root, which lacks
      # the tooling the host runner images already ship (sudo + a sudo-capable
      # user, git, curl, ca-certificates). The 2404 cells skip this — their host
      # runner already provides these. setup.sh/install_dependencies.sh install
      # the actual build deps; this only bootstraps enough to reach setup.sh.
      - name: Bootstrap ubuntu:26.04 container prerequisites
        if: matrix.container != ''
        # shell: sh — bash does not exist in the bare container until this step
        # installs it, so the job-level bash default would fail here.
        shell: sh
        run: |
          # Harden apt before the very first fetch. arm64 pulls from ports.ubuntu.com,
          # which is poorly mirrored and — from GitHub's arm runners — unreachable
          # over IPv6 and flaky over IPv4 (it has failed whole build cells at this
          # bootstrap). Force IPv4, add retries + timeout, and PREFER Azure's ports
          # mirror (fast + reliable from the Azure-hosted runners), falling back to
          # ports.ubuntu.com if it is unreachable. Only arm64 is affected — amd64
          # containers use archive.ubuntu.com, which the sed below does not match.
          printf '%s\n' 'Acquire::ForceIPv4 "true";' 'Acquire::Retries "8";' \
            'Acquire::http::Timeout "30";' > /etc/apt/apt.conf.d/99-ci-resilient
          SRC=/etc/apt/sources.list.d/ubuntu.sources
          [ -f "$SRC" ] || SRC=/etc/apt/sources.list
          cp "$SRC" "${SRC}.orig" 2>/dev/null || true
          sed -i 's|//ports.ubuntu.com|//azure.ports.ubuntu.com|g' "$SRC" 2>/dev/null || true
          if ! apt-get update; then
            echo ">>> azure.ports.ubuntu.com unreachable — reverting to ports.ubuntu.com"
            cp "${SRC}.orig" "$SRC" 2>/dev/null \
              || sed -i 's|//azure.ports.ubuntu.com|//ports.ubuntu.com|g' "$SRC"
            apt-get update
          fi
          apt-get install -y --no-install-recommends sudo git curl ca-certificates bash

      # NOTE on /dev/fuse in the 2604 container (debugged 2026-06-07): the GHA
      # job container is created WITHOUT --device /dev/fuse. mknod'ing the node
      # inside the container succeeds (Docker's default device cgroup allows
      # `c *:* m`) but read/write on 10:229 stays DENIED by the device cgroup —
      # the kernel consults it on every permission check of a device inode, even
      # for root. So setup.sh's VAL-03 ([[ -r /dev/fuse ]]) can never pass in
      # this container. Compilation never opens /dev/fuse (it is a runtime-only
      # requirement of fuse-overlayfs), so the build step sets
      # SKIP_FUSE_CHECK=true for container cells instead of creating the node.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve build track
        id: track
        run: |
          TRACK="${{ needs.resolve-track.outputs.track }}"
          echo "track=${TRACK}" >> "$GITHUB_OUTPUT"
          echo "Build track: ${TRACK}"

      # Turns the track into KEY=VALUE pairs for setup.sh. For stable/v5 those
      # are resolve-track's tags, validated before use. Also works out the two
      # toolchain versions in the compiler cache key: the Rust version the
      # build will install (passed on as RUST_VERSION so both agree) and the
      # sccache version from config.sh.
      - name: Prepare the build environment
        id: env
        env:
          TRACK: ${{ steps.track.outputs.track }}
          RESOLVED_ENV: ${{ needs.resolve-track.outputs.resolved_env }}
        run: |
          set -euo pipefail
          source scripts/ci_helpers.sh
          BUILD_ENV="${RUNNER_TEMP}/build-env"
          if [[ "${TRACK}" == "stable" || "${TRACK}" == "v5" ]]; then
            printf '%s\n' "${RESOLVED_ENV}" > "${RUNNER_TEMP}/resolved.env"
            resolved_env_pairs "${RUNNER_TEMP}/resolved.env" > "${BUILD_ENV}"
          elif [[ "${TRACK}" == "nightly" ]]; then
            printf '%s\n' NIGHTLY_BUILD=true SHALLOW_CLONE=false > "${BUILD_ENV}"
          else
            echo "::error::unknown track '${TRACK}'"; exit 1
          fi
          NETAVARK_TAG="$(sed -n 's/^NETAVARK_TAG=//p' "${BUILD_ENV}")"
          RUST="$(export SKIP_CONFIG_SOURCE=1 && source ./functions.sh && get_required_rust_version "${NETAVARK_TAG}")"
          # The single quotes keep ${...} literal for sed.
          # shellcheck disable=SC2016
          SCCACHE="$(sed -n 's/^export SCCACHE_VERSION="\${SCCACHE_VERSION:-\([^}]*\)}"$/\1/p' config.sh)"
          for v in "${RUST}" "${SCCACHE}"; do
            [[ "${v}" =~ ^[A-Za-z0-9.]+$ ]] || { echo "::error::bad toolchain version '${v}'"; exit 1; }
          done
          echo "RUST_VERSION=${RUST}" >> "${BUILD_ENV}"
          echo "rust=${RUST}" >> "$GITHUB_OUTPUT"
          echo "sccache=${SCCACHE}" >> "$GITHUB_OUTPUT"
          cat "${BUILD_ENV}"

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-mod
            ~/.cache/go-build
          # CICD-07: distro + explicit matrix.arch in the key isolate caches per
          # distro AND arch (matrix.arch is authoritative regardless of how the
          # runner reports runner.arch), preventing cross-distro contamination.
          key: go-${{ matrix.distro }}-${{ matrix.arch }}-${{ steps.track.outputs.track }}-${{ github.run_number }}
          restore-keys: |
            go-${{ matrix.distro }}-${{ matrix.arch }}-${{ steps.track.outputs.track }}-
            go-${{ matrix.distro }}-${{ matrix.arch }}-

      # Rust (sccache) and C (ccache) compiler output. Keyed by distro,
      # architecture, track, Rust version and sccache version, restored by
      # prefix from the latest run with the same toolchain. A key is only an
      # index: sccache hashes the rustc binary and ccache hashes the compiler
      # (compilercheck=content), so a changed toolchain behind the same key
      # misses the cache instead of reusing a wrong object. Sizes are capped
      # in the build step. Only compiler output lives here, never signing
      # keys or repository state. Restore only: the save step after the
      # report writes a new entry only when this run added to the cache, so
      # unchanged runs do not use up the repository's cache quota.
      - name: Restore Rust and C compiler output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sccache
            ~/.cache/ccache
          key: cc-v1-${{ matrix.distro }}-${{ matrix.arch }}-${{ steps.track.outputs.track }}-rust${{ steps.env.outputs.rust }}-sccache${{ steps.env.outputs.sccache }}-${{ github.run_id }}
          restore-keys: |
            cc-v1-${{ matrix.distro }}-${{ matrix.arch }}-${{ steps.track.outputs.track }}-rust${{ steps.env.outputs.rust }}-sccache${{ steps.env.outputs.sccache }}-

      # ccache is installed here (not only by install_dependencies.sh) because
      # the build step zeroes its counters before setup.sh runs.
      - name: Update apt cache
        run: |
          # arm64 cells fetch build deps from ports.ubuntu.com, which is poorly
          # mirrored and whose IPv6 endpoints are unreachable from GitHub's arm
          # runners (no IPv6 route) — apt burns attempts on dead IPv6, then times
          # out on the overloaded IPv4 hosts, failing the build. Force IPv4 and add
          # retries so transient ports.ubuntu.com hiccups don't break it. Harmless
          # on amd64 (archive.ubuntu.com). The drop-in persists for the whole job,
          # so setup.sh's apt-get install (where arm64 actually failed) inherits it.
          printf '%s\n' 'Acquire::ForceIPv4 "true";' 'Acquire::Retries "8";' \
            'Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-ci-resilient > /dev/null
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ccache

      - name: Build all components
        run: |
          set -euo pipefail
          # Dotted DISTRO override (T-21-03): closed case map from the matrix
          # label to the dotted VERSION_ID detect_distro_version_id validates
          # against ^[0-9]+\.[0-9]+$. Anything outside the allowlist hard-fails.
          case "${{ matrix.distro }}" in
            2404) DISTRO_DOTTED=24.04 ;;
            2604) DISTRO_DOTTED=26.04 ;;
            *) echo "ERROR: unknown matrix.distro '${{ matrix.distro }}'" >&2; exit 1 ;;
          esac
          DESTDIR="${{ runner.temp }}/podman-staging"
          mkdir -p "$DESTDIR"
          # Cache dirs must exist and be writable by root.
          mkdir -p "$HOME/.cache/go-build" "$HOME/.cache/go-mod" "$HOME/.cache/sccache" "$HOME/.cache/ccache"
          # Arguments for `sudo env` (bypasses env_reset completely). Caches
          # point at runner-visible paths so actions/cache can save them.
          env_args=(
            DEBIAN_FRONTEND=noninteractive
            "DESTDIR=${DESTDIR}"
            "GOCACHE=$HOME/.cache/go-build" "GOMODCACHE=$HOME/.cache/go-mod"
            # Thread the dotted DISTRO override into setup.sh so config.sh
            # composes VERSION_SUFFIX=~ubuntu${DISTRO_DOTTED}.podmanN for this cell.
            "DISTRO=${DISTRO_DOTTED}"
            # Compiler caches. CACHE_STRICT fails the build if a wrapper is
            # missing, so a broken cache is a failure, not a slow build. The
            # sccache server never idles out, so the report step can read
            # its statistics afterwards.
            SCCACHE_ENABLED=true CCACHE_ENABLED=true CACHE_STRICT=true
            "SCCACHE_DIR=$HOME/.cache/sccache" SCCACHE_CACHE_SIZE=1G SCCACHE_IDLE_TIMEOUT=0
            "CCACHE_DIR=$HOME/.cache/ccache" CCACHE_MAXSIZE=500M
          )
          # Container cells: /dev/fuse is unusable inside the job container (the
          # device cgroup denies r/w on 10:229 even for root — see the NOTE above
          # the checkout step). The fuse gate is advisory at build time (nothing
          # opens /dev/fuse during compilation). VAL-03 is a warning anyway;
          # SKIP_FUSE_CHECK=true just labels this as a build-only environment.
          if [[ -n "${{ matrix.container }}" ]]; then
            env_args+=(SKIP_FUSE_CHECK=true)
          fi
          # Track environment from the previous step: resolved tags (stable/v5)
          # or the nightly switches, plus RUST_VERSION.
          while IFS= read -r pair; do
            [[ -n "${pair}" ]] && env_args+=("${pair}")
          done < "${RUNNER_TEMP}/build-env"
          # ccache keeps its counters in CCACHE_DIR, which was just restored.
          # Zero them so the report counts only this run.
          CCACHE_DIR="$HOME/.cache/ccache" ccache --zero-stats
          sudo env "${env_args[@]}" ./setup.sh
        timeout-minutes: 150

      # Proves the wrappers were used: compiler_cache_report fails the cell
      # when an enabled cache saw no compile requests. Also stops the
      # sccache server so its cache is flushed before it is saved, and sets
      # changed=true when either cache missed (added entries) this run. It
      # runs as root, like the build that filled the caches (the 2404 cells
      # build on the runner host through sudo).
      - name: Report compiler cache use
        id: ccreport
        run: |
          set -euo pipefail
          sudo env SCCACHE_ENABLED=true CCACHE_ENABLED=true \
            "SCCACHE_DIR=$HOME/.cache/sccache" "CCACHE_DIR=$HOME/.cache/ccache" \
            "GITHUB_OUTPUT=${GITHUB_OUTPUT}" \
            bash -c 'source scripts/ci_helpers.sh && compiler_cache_report'
          # Fix ownership so actions/cache can save the caches.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/go-build" "$HOME/.cache/go-mod" \
            "$HOME/.cache/sccache" "$HOME/.cache/ccache"

      - name: Save Rust and C compiler output
        if: steps.ccreport.outputs.changed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/sccache
            ~/.cache/ccache
          key: cc-v1-${{ matrix.distro }}-${{ matrix.arch }}-${{ steps.track.outputs.track }}-rust${{ steps.env.outputs.rust }}-sccache${{ steps.env.outputs.sccache }}-${{ github.run_id }}

      - name: Debug DESTDIR contents
        if: always()
        run: |
          DESTDIR="${{ runner.temp }}/podman-staging"
          echo "=== DESTDIR tree (directories) ==="
          find "$DESTDIR" -type d 2>/dev/null | head -50 || echo "DESTDIR not found or empty"
          echo ""
          echo "=== DESTDIR files (binaries) ==="
          find "$DESTDIR" -type f -name '*.so*' -o -type f -perm /111 2>/dev/null | head -50 || echo "No binaries found"
          echo ""
          echo "=== DESTDIR usr/bin/ ==="
          ls -la "$DESTDIR/usr/bin/" 2>/dev/null || echo "usr/bin/ does not exist"
          echo ""
          echo "=== DESTDIR total file count ==="
          # `|| echo 0` — under bash -o pipefail a missing DESTDIR would fail
          # the pipeline, and this step runs if: always() (i.e. after failures
          # when DESTDIR may not exist).
          find "$DESTDIR" -type f 2>/dev/null | wc -l || echo 0

      - name: Install nFPM
        run: |
          # Use Go installed by setup.sh
          PATH="/opt/go/$(ls /opt/go/)/bin:$HOME/go/bin:$PATH"
          export PATH
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.45.0

      - name: Package all components
        run: |
          # Same dotted DISTRO override so package_all.sh's config.sh source
          # composes the correct per-distro VERSION_SUFFIX and the .deb filenames
          # carry ~ubuntu${DISTRO_DOTTED}.podmanN for this cell.
          case "${{ matrix.distro }}" in
            2404) DISTRO_DOTTED=24.04 ;;
            2604) DISTRO_DOTTED=26.04 ;;
            *) echo "ERROR: unknown matrix.distro '${{ matrix.distro }}'" >&2; exit 1 ;;
          esac
          export DISTRO="$DISTRO_DOTTED"
          PATH="/opt/go/$(ls /opt/go/)/bin:$HOME/go/bin:$PATH"
          export PATH
          export DESTDIR="${{ runner.temp }}/podman-staging"
          if [[ "${{ steps.track.outputs.track }}" == "nightly" ]]; then
            export NIGHTLY_BUILD=true
          fi
          ./scripts/package_all.sh

      # Compares the library packages detected from the built binaries with
      # the known set for this distro, and checks that every nFPM file renders
      # and parses, so a wrong library name fails the cell before anything is
      # uploaded or published.
      - name: Verify detected dependencies
        run: |
          case "${{ matrix.distro }}" in
            2404) DISTRO_DOTTED=24.04 ;;
            2604) DISTRO_DOTTED=26.04 ;;
            *) echo "ERROR: unknown matrix.distro '${{ matrix.distro }}'" >&2; exit 1 ;;
          esac
          export DISTRO="$DISTRO_DOTTED"
          PATH="/opt/go/$(ls /opt/go/)/bin:$HOME/go/bin:$PATH"
          export PATH
          export DESTDIR="${{ runner.temp }}/podman-staging"
          ./scripts/verify_depends.sh

      # Nightly only: the upstream commits this cell compiled. The publish
      # job folds them into the nightly checkpoint once this cell's packages
      # are deployed.
      - name: Record the nightly revisions this cell built
        if: steps.track.outputs.track == 'nightly'
        run: |
          set -euo pipefail
          source scripts/ci_helpers.sh
          mkdir -p nightly-revs
          nightly_record_revisions build "${{ matrix.distro }}-${{ matrix.arch }}" > nightly-revs/revisions.txt
          cat nightly-revs/revisions.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # CICD-07: distro + arch in the artifact name — the four names are
          # debs-2404-amd64, debs-2404-arm64, debs-2604-amd64, debs-2604-arm64.
          name: debs-${{ matrix.distro }}-${{ matrix.arch }}
          path: output/*.deb
          if-no-files-found: error
          # The publish job consumes these within the same run; retention only
          # serves post-hoc debugging. Kept short so daily nightly x 4 cells
          # don't accumulate ~30 days of .deb artifacts in Actions storage.
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.track.outputs.track == 'nightly'
        with:
          name: nightly-revs-${{ matrix.distro }}-${{ matrix.arch }}
          path: nightly-revs/revisions.txt
          if-no-files-found: error
          retention-days: 7

  # ============================================
  # Publish APT repository to GitHub Pages
  # ============================================
  # Runs when at least one build cell succeeded. needs.build.result is
  # 'success' when every cell passed and 'failure' when some failed
  # (fail-fast: false); 'cancelled' or 'skipped' means no build ran.
  #
  # The job reads each cell's conclusion from the GitHub API and publishes
  # exactly the cells that succeeded. Their artifacts must download; a
  # missing artifact for a successful cell fails the job instead of quietly
  # publishing less. A distro is published when at least one of its arch
  # cells succeeded: ci_publish.sh carries a failed arch's last-good packages
  # over from the live suite (preserve_missing_arches). A distro whose cells
  # all failed is not published: its suites are carried over unchanged from
  # the live repo by the other distro's ci_publish.sh pass. If no cell
  # succeeded, nothing deploys.
  #
  # CICD-08 (atomic publish): the repo is assembled completely in
  # repo-output and deployed to Pages in one step, so the live repo is
  # replaced whole or not at all. The pages-deploy concurrency group queues
  # publish jobs from every track, so only one run assembles and deploys at a
  # time, and each one starts from what the previous one deployed (it waits
  # for the deploy to reach the live site before it releases the group).
  publish:
    needs: [resolve-track, build]
    if: always() && github.ref == 'refs/heads/main' && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TRACK: ${{ needs.resolve-track.outputs.track }}
      REPO_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run doc and HTML unit tests
        run: |
          bash tests/test_docs_suites.sh
          bash tests/test_index_html_distro.sh

      # Every build cell's conclusion, by job name (build-<distro>-<arch>).
      # The run-wide list with filter=latest includes cells that succeeded in
      # an earlier attempt when only failed jobs were re-run.
      - name: Read build cell conclusions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest" \
            --jq '.jobs[] | select(.name | startswith("build-")) | "\(.name | ltrimstr("build-")) \(.conclusion)"' \
            > "${RUNNER_TEMP}/cells.txt"
          cat "${RUNNER_TEMP}/cells.txt"

      # CICD-07 / T-21-05 (no cross-distro merge): every cell's artifact
      # downloads into its own directory (artifacts/debs-2404-amd64/, ...):
      # no merge-multiple, so packages built for one distro can never land in
      # another's publish. A download error fails the job; the next step
      # checks that every successful cell's artifact arrived.
      - name: Download 24.04 artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: debs-2404-*
          path: artifacts/

      - name: Download 26.04 artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: debs-2604-*
          path: artifacts/

      - name: Download nightly revisions
        if: needs.resolve-track.outputs.track == 'nightly'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nightly-revs-*
          path: artifacts/

      - name: Select the cells and distros to publish
        id: select
        run: |
          set -euo pipefail
          source scripts/ci_helpers.sh
          eval "$(sed -n '/^VALID_TRACKS=/,/^VALID_DISTROS=/p' config.sh)"
          REQUIRE_REVS=false
          [[ "${TRACK}" == "nightly" ]] && REQUIRE_REVS=true
          mapfile -t CELLS < <(published_cells "${RUNNER_TEMP}/cells.txt" artifacts "${REQUIRE_REVS}" "${VALID_DISTROS[@]}")
          if [[ ${#CELLS[@]} -eq 0 ]]; then
            echo "::error::no build cell succeeded; refusing to deploy"
            exit 1
          fi
          DISTROS="$(cells_to_distros "${CELLS[@]}" | xargs)"
          echo "Publishing cells: ${CELLS[*]} (distros: ${DISTROS})"
          echo "cells=${CELLS[*]}" >> "$GITHUB_OUTPUT"
          echo "distros=${DISTROS}" >> "$GITHUB_OUTPUT"

      # gpgv checks the signatures in verify_repo_integrity.sh.
      - name: Install reprepro
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gpgv

      # Gate the publish on the repo-assembly regression tests. These drive the
      # real ci_publish.sh / repo_manage.sh hermetically (throwaway GPG, temp
      # dirs, a local mock HTTP repo — they never touch the live repo or deploy).
      # test_ci_publish_multipass reproduces the two-pass cross-distro clobber
      # that froze stable-2404 at an old version; a regression here blocks deploy.
      # REQUIRE_INTEGRATION_DEPS=1 makes a missing tool a failure, not a skip.
      - name: Run repo-assembly regression tests
        env:
          REQUIRE_INTEGRATION_DEPS: '1'
        run: |
          set -euo pipefail
          bash tests/test_repo_assemble_byhash.sh
          bash tests/test_ci_publish_multipass.sh
          bash tests/test_ci_publish_shared_pool.sh
          bash tests/test_verify_repo_integrity.sh
          bash tests/test_ci_helpers.sh

      # Per-distro sequential publish into ONE accumulating repo-output, in
      # VALID_DISTROS order (2404 then 2604), for the selected distros only.
      # Each distro's input is the packages of its successful cells.
      # ci_publish.sh's mirror-then-include model (OTHER_SUITES = ALL_SUITES −
      # PUBLISH_TARGETS) re-mirrors non-target suites from the live repo, EXCEPT
      # any suite an earlier pass already materialized into the accumulating
      # repo-output — those are preserved in place so the 2604 pass cannot
      # clobber the 2404 pass's freshly-built suites (the cross-distro clobber
      # fixed in "preserve earlier-pass suites"). The compact labels 2404/2604
      # are validated by config.sh against VALID_DISTROS (T-21-07).
      - name: Build and publish repository
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          CELLS: ${{ steps.select.outputs.cells }}
          DISTROS: ${{ steps.select.outputs.distros }}
        run: |
          set -euo pipefail
          for distro in ${DISTROS}; do
            deb_dir="publish-debs/${distro}"
            mkdir -p "${deb_dir}"
            for cell in ${CELLS}; do
              if [[ "${cell%%-*}" == "${distro}" ]]; then
                cp "artifacts/debs-${cell}"/*.deb "${deb_dir}/"
              fi
            done
            echo ">>> Publishing ${distro} ($(find "${deb_dir}" -maxdepth 1 -name '*.deb' | wc -l) debs from cells: ${CELLS})"
            ./scripts/ci_publish.sh "${TRACK}" "${distro}" "${deb_dir}" "${REPO_URL}" "repo-output"
          done

      # Integrity gate (explicit, on the fully-assembled repo). ci_publish.sh
      # already runs verify_repo_integrity.sh at the end of each pass; re-run it
      # here over the final combined repo-output as the last checkpoint before the
      # Pages upload. Asserts every suite is signed by the published key, its
      # signed index matches Release AND the pool .debs it advertises — the
      # guardrail against the "File has unexpected size" shared-pool overwrite
      # bug. A mismatch fails the job and no partial / inconsistent repository
      # is ever deployed.
      - name: Verify repository integrity before publish
        run: ./scripts/verify_repo_integrity.sh --keyring "$PWD/repo-output/podman-ubuntu.gpg" "$PWD/repo-output"

      # MIGR-04 installability smoke gate, before the Pages upload, so an
      # uninstallable package never reaches the live repo (D-13/D-16). It runs
      # for the distros this run published (suites carried over from the live
      # repo were tested when they were published). Each leg runs the fresh /
      # migrate-from-distro / upgrade-from-live scenarios against the
      # assembled file:// repo in real ubuntu containers (D-15), with apt
      # checking the signatures. The helper exits 1 on failure, which stops
      # the job before configure-pages/upload-pages-artifact/deploy-pages.
      # amd64-only (D-17).
      - name: Smoke test — install podman-suite from assembled repo per distro
        env:
          DISTROS: ${{ steps.select.outputs.distros }}
        run: |
          set -euo pipefail
          export LIVE_REPO_URL="${REPO_URL}"
          echo ">>> Running smoke gate for track ${TRACK}"
          for distro in ${DISTROS}; do
            ./scripts/smoke_repo_install.sh "${distro}" "$PWD/repo-output"
          done

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # Atomic deploy (CICD-08): every distro is assembled into repo-output
      # before this single one-shot Pages deploy. The live repository is
      # replaced in one step or not at all.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: repo-output/

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      # The deploy is done when clients can see it. Poll every suite's live
      # InRelease until it matches the deployed one (suites carried over
      # verbatim match at once). The next queued publish starts from the live
      # repo, and the nightly checkpoint below is only saved once this holds.
      - name: Wait for the deploy to reach the live site
        run: |
          set -euo pipefail
          source scripts/ci_helpers.sh
          suites=()
          for d in repo-output/dists/*/; do
            [[ -f "${d}InRelease" ]] && suites+=("$(basename "${d}")")
          done
          wait_for_propagation "${REPO_URL}" "$PWD/repo-output" "${suites[@]}"

      # Nightly only: record what is now deployed. Restore the latest
      # checkpoint, replace the entries of the cells this run deployed with
      # the revisions they built, and save it under a new key.
      - name: Restore the nightly checkpoint
        if: needs.resolve-track.outputs.track == 'nightly'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nightly-revisions/checkpoint.txt
          key: nightly-rev-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nightly-rev-v2-

      - name: Merge the deployed nightly revisions
        if: needs.resolve-track.outputs.track == 'nightly'
        env:
          CELLS: ${{ steps.select.outputs.cells }}
        run: |
          set -euo pipefail
          source scripts/ci_helpers.sh
          mkdir -p /tmp/nightly-revisions
          files=()
          for cell in ${CELLS}; do
            files+=("artifacts/nightly-revs-${cell}/revisions.txt")
          done
          nightly_merge_revisions /tmp/nightly-revisions/checkpoint.txt \
            /tmp/nightly-revisions/checkpoint.new "${files[@]}"
          mv /tmp/nightly-revisions/checkpoint.new /tmp/nightly-revisions/checkpoint.txt
          cat /tmp/nightly-revisions/checkpoint.txt

      - name: Save the nightly checkpoint
        if: needs.resolve-track.outputs.track == 'nightly'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/nightly-revisions/checkpoint.txt
          key: nightly-rev-v2-${{ github.run_id }}-${{ github.run_attempt }}
