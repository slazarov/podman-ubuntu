# Podman containers configuration
# Installed by podman-ubuntu to /etc/containers/containers.conf
# See: man containers.conf(5)

[containers]

# Default seccomp profile for container runtime security
# Requires: /usr/share/containers/seccomp.json (from containers-common package)
# Comment out if seccomp.json is not available on your system
seccomp_profile = "/usr/share/containers/seccomp.json"

[engine]

# Default OCI runtime - crun is faster and uses less memory than runc
runtime = "crun"

# helper_binaries_dir is deliberately left at Podman's built-in default
# (/usr/local/libexec/podman, /usr/local/lib/podman, /usr/libexec/podman,
# /usr/lib/podman). podman-ubuntu installs netavark and aardvark-dns to
# /usr/libexec/podman so they are found even when a user
# ~/.config/containers/containers.conf exists -- that file replaces this one
# entirely rather than layering on top of it.

[network]

# Network backend - netavark is the modern replacement for CNI
# CNI was removed in Podman 5.0
network_backend = "netavark"
